<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 64" width="800" height="64" role="img"><title>connect</title><style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(800px); } }
    .ink{fill:#f2f0fa}.muted{fill:#9b98b3}.purple{fill:#a78bfa}.b{font-weight:700}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
        <rect x="2" y="12" width="54" height="40" rx="10" fill="#d2ff3a"/>
        <text x="29" y="40" font-size="22" text-anchor="middle" font-weight="700" fill="#0f0f0f">@</text>
        <text x="74" y="42" font-size="30" class="ink b">/ connect</text>
        <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs>
        <rect x="294" y="31" width="506" height="3" rx="1.5" fill="url(#g)"/>
        <text x="760" y="26" font-size="18" class="muted" style="animation: twinkle 3s ease-in-out 0.4s infinite;">*</text>
        </svg>