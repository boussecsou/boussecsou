<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 322" width="800" height="322" role="img"><title>Savant Azurian 2</title><style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #f2f0fa; } .muted { fill: #9b98b3; }
    .purple { fill: #a78bfa; } .b { font-weight: 700; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes eyes { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(800px); } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style><rect x="1" y="1" width="798" height="320" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect x="1" y="1" width="10" height="320" rx="5" fill="#a78bfa"/><text x="40" y="58" font-size="34" class="ink b">Savant Azurian 2</text><text x="40" y="100" font-size="22" class="muted">A voice-first AI assistant on Azure.</text><text x="40" y="132" font-size="22" class="muted">Exploring controlled tool use, OAuth,</text><text x="40" y="164" font-size="22" class="muted">explicit approval and secure backends.</text><rect x="40" y="212" width="190" height="40" rx="20" fill="#d2ff3a"/><circle cx="64" cy="232" r="6" fill="#0f0f0f" style="animation: pulse 1.8s ease-in-out infinite;"/><text x="80" y="239" font-size="20" font-weight="700" fill="#0f0f0f">in progress</text><rect x="246" y="212" width="190" height="40" rx="20" fill="none" stroke="#a78bfa" stroke-width="2"/><text x="341" y="239" font-size="20" text-anchor="middle" class="purple">private repo</text><text x="760" y="58" font-size="30" text-anchor="end" class="muted" style="animation: twinkle 3s ease-in-out infinite;">*</text><text x="40" y="298" font-size="19" class="purple">LangGraph · Notion MCP · Azure</text></svg>