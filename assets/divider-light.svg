<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="800" height="24" role="img"><style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #0f0f0f; } .muted { fill: #6b6880; }
    .purple { fill: #8b5cf6; } .b { font-weight: 700; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes eyes { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(800px); } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <defs><linearGradient id="d" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
      <clipPath id="c"><rect x="0" y="0" width="800" height="24"/></clipPath></defs>
    <rect x="0" y="10" width="800" height="3" rx="1.5" fill="url(#d)" opacity=".55"/>
    <g clip-path="url(#c)"><rect x="0" y="9" width="150" height="5" rx="2.5" fill="#c6f400" style="animation: sweep 5s ease-in-out infinite alternate;"/></g>
    </svg>