<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img"><title>C++ Event System</title><style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #0f0f0f; } .muted { fill: #6b6880; }
    .purple { fill: #8b5cf6; } .b { font-weight: 700; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes eyes { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(800px); } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style><rect x="1" y="1" width="798" height="288" rx="16" fill="#faf8ff" stroke="#e3dcf7" stroke-width="2"/><rect x="1" y="1" width="10" height="288" rx="5" fill="#8b5cf6"/><text x="40" y="58" font-size="34" class="ink b">C++ Event System</text><text x="40" y="100" font-size="22" class="muted">A command line that turns typed commands</text><text x="40" y="132" font-size="22" class="muted">into events: validation, bus, handlers.</text><rect x="40" y="180" width="190" height="40" rx="20" fill="#c6f400"/><circle cx="64" cy="200" r="6" fill="#0f0f0f" style="animation: pulse 1.8s ease-in-out infinite;"/><text x="80" y="207" font-size="20" font-weight="700" fill="#0f0f0f">in progress</text><rect x="246" y="180" width="190" height="40" rx="20" fill="none" stroke="#8b5cf6" stroke-width="2"/><text x="341" y="207" font-size="20" text-anchor="middle" class="purple">private repo</text><text x="760" y="58" font-size="30" text-anchor="end" class="muted" style="animation: twinkle 3s ease-in-out infinite;">*</text><text x="40" y="266" font-size="19" class="purple">C++ · CMake · std::expected</text></svg>