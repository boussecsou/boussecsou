<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 320" width="272" height="320" role="img"><title>Agents</title><style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
