<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 320" width="272" height="320" role="img"><title>Backend</title><style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #0f0f0f; } .muted { fill: #6b6880; }
    .purple { fill: #8b5cf6; } .b { font-weight: 700; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes eyes { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(272px); } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
