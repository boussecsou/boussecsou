<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 468" width="800" height="468" role="img"><title>Engineering principles</title><style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #f2f0fa; } .muted { fill: #9b98b3; }
    .purple { fill: #a78bfa; } .b { font-weight: 700; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes eyes { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(800px); } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style><rect x="1" y="1" width="798" height="466" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><g style="animation: rise .5s ease 0.15s both;"><circle cx="58" cy="62" r="19" fill="#d2ff3a"/><path d="M49 62 L56 70 L68 54" fill="none" stroke="#0f0f0f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="71" font-size="26" class="ink b">Explicit approval for sensitive actions</text></g><g style="animation: rise .5s ease 0.27s both;"><circle cx="58" cy="124" r="19" fill="#d2ff3a"/><path d="M49 124 L56 132 L68 116" fill="none" stroke="#0f0f0f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="133" font-size="26" class="ink b">Least-privilege permissions</text></g><g style="animation: rise .5s ease 0.39s both;"><circle cx="58" cy="186" r="19" fill="#d2ff3a"/><path d="M49 186 L56 194 L68 178" fill="none" stroke="#0f0f0f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="195" font-size="26" class="ink b">Clear system boundaries</text></g><g style="animation: rise .5s ease 0.51s both;"><circle cx="58" cy="248" r="19" fill="#d2ff3a"/><path d="M49 248 L56 256 L68 240" fill="none" stroke="#0f0f0f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="257" font-size="26" class="ink b">Testing and evaluation</text></g><g style="animation: rise .5s ease 0.63s both;"><circle cx="58" cy="310" r="19" fill="#d2ff3a"/><path d="M49 310 L56 318 L68 302" fill="none" stroke="#0f0f0f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="319" font-size="26" class="ink b">Reliability and maintainability</text></g><g style="animation: rise .5s ease 0.75s both;"><circle cx="58" cy="372" r="19" fill="#d2ff3a"/><path d="M49 372 L56 380 L68 364" fill="none" stroke="#0f0f0f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="381" font-size="26" class="ink b">AI behavior that stays controllable</text></g><text x="40" y="442" font-size="19" class="muted">priorities I work toward, not guarantees.</text></svg>