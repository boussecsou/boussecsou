<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="380" height="72" role="img"><title>GitHub</title><style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(380px); } }
    .ink{fill:#0f0f0f}.muted{fill:#6b6880}.purple{fill:#8b5cf6}.b{font-weight:700}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style><rect x="2" y="2" width="376" height="68" rx="34" fill="#c6f400"/><text x="172.0" y="45" font-size="23" font-weight="700" text-anchor="middle" fill="#0f0f0f">github.com/boussecsou</text><text x="336" y="46" font-size="28" font-weight="700" fill="#0f0f0f" style="animation: nudge 1.6s ease-in-out infinite;">→</text></svg>